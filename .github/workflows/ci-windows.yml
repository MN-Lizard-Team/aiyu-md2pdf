name: CI Windows

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  e2e-windows:
    name: E2E tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Pandoc
        run: choco install pandoc -y --no-progress

      - name: Install poppler (pdfinfo)
        run: choco install poppler -y --no-progress

      - name: Add Poppler to PATH
        shell: pwsh
        run: |
          $candidates = @(
            "C:\ProgramData\chocolatey\bin",
            "C:\ProgramData\chocolatey\lib\poppler\tools\Library\bin",
            "C:\Program Files\poppler\Library\bin"
          )
          $pdfinfo = $candidates | Where-Object { Test-Path "$_\pdfinfo.exe" } | Select-Object -First 1
          if (-not $pdfinfo) {
            $found = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib" -Recurse -Filter "pdfinfo.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $pdfinfo = Split-Path $found.FullName }
          }
          if (-not $pdfinfo) { Write-Error "pdfinfo.exe not found after Poppler installation"; exit 1 }
          Write-Host "Poppler bin: $pdfinfo"
          echo $pdfinfo >> $env:GITHUB_PATH

      - name: Install TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Install LaTeX packages
        shell: pwsh
        run: |
          tlmgr update --self
          tlmgr install latexmk fontspec polyglossia fancyhdr fancyvrb lastpage xecjk environ trimspaces ulem pgfplots booktabs longtable caption graphics tools ec xcolor geometry hyperref url etoolbox enumitem titlesec tocloft adjustbox float
          foreach ($package in @('polyglossia.sty', 'enumitem.sty', 'titlesec.sty', 'tocloft.sty', 'adjustbox.sty', 'float.sty')) {
            $found = kpsewhich $package
            if (-not $found) { Write-Error "Required LaTeX package missing: $package"; exit 1 }
            Write-Host "$package -> $found"
          }

      - name: Install Sarabun font
        shell: pwsh
        run: |
          # Install to system fonts folder (C:\Windows\Fonts) for XeLaTeX visibility
          $fontDir = "C:\Windows\Fonts"
          $fonts = @('Sarabun-Regular','Sarabun-Bold','Sarabun-Italic','Sarabun-BoldItalic')
          foreach ($f in $fonts) {
            $url = "https://github.com/google/fonts/raw/main/ofl/sarabun/$f.ttf"
            $dest = Join-Path $fontDir "$f.ttf"
            Invoke-WebRequest -Uri $url -OutFile $dest
            # Register in registry so fontspec/fontconfig can find it
            $regPath = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts"
            $regName = "$f (TrueType)"
            New-ItemProperty -Path $regPath -Name $regName -Value $dest -PropertyType String -Force | Out-Null
          }
          Write-Host "Installed fonts:"
          Get-ChildItem "C:\Windows\Fonts\Sarabun*" | ForEach-Object { Write-Host "  $($_.Name)" }
          # Refresh font cache
          Add-Type -AssemblyName System.Drawing
          $fonts = [System.Drawing.Text.PrivateFontCollection]::new()
          $fonts.AddFontFile("C:\Windows\Fonts\Sarabun-Regular.ttf")
          Write-Host "Font family name: $($fonts.Families[0].Name)"

      - run: npm ci

      - name: Add npm bins to PATH
        shell: pwsh
        run: |
          # Add local node_modules/.bin (for mmdc from npm ci)
          $localBin = Join-Path (Get-Location) "node_modules\.bin"
          echo $localBin >> $env:GITHUB_PATH
          # Add npm global bin (fallback)
          $npmGlobal = npm config get prefix
          echo $npmGlobal >> $env:GITHUB_PATH
          Write-Host "Added to PATH: $localBin, $npmGlobal"

      - name: Verify tools
        shell: pwsh
        run: |
          Write-Host "pandoc: $(pandoc --version | Select-Object -First 1)"
          Write-Host "xelatex: $(xelatex --version 2>&1 | Select-Object -First 1)"
          Write-Host "mmdc: $(mmdc --version 2>&1 | Select-Object -First 1)"
          Write-Host "pdfinfo: $(pdfinfo -v 2>&1 | Select-Object -First 1)"

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-windows
          path: result/
          retention-days: 7
