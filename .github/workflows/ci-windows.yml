name: CI Windows

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  e2e-windows:
    name: E2E tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Pandoc
        run: choco install pandoc -y --no-progress

      - name: Install poppler (pdfinfo)
        run: choco install poppler -y --no-progress

      - name: Install TinyTeX
        uses: r-lib/actions/setup-tinytex@v2
        with:
          packages: |
            latexmk
            fontspec
            polyglossia
            fancyhdr
            fancyvrb
            lastpage
            xecjk
            environ
            trimspaces
            ulem
            pgfplots
            booktabs
            longtable
            caption
            graphics
            tools
            ec
            xcolor
            geometry
            hyperref
            url
            etoolbox
            enumitem
            titlesec
            tocloft
            adjustbox
            float

      - name: Install Sarabun font
        shell: pwsh
        run: |
          $fontDir = "$env:LOCALAPPDATA\Microsoft\Windows\Fonts"
          New-Item -ItemType Directory -Force -Path $fontDir
          $fonts = @('Sarabun-Regular','Sarabun-Bold','Sarabun-Italic','Sarabun-BoldItalic')
          foreach ($f in $fonts) {
            $url = "https://github.com/google/fonts/raw/main/ofl/sarabun/$f.ttf"
            $dest = Join-Path $fontDir "$f.ttf"
            Invoke-WebRequest -Uri $url -OutFile $dest
          }
          $shell = New-Object -ComObject Shell.Application
          $fontsFolder = $shell.Namespace(0x14)
          foreach ($f in $fonts) {
            $fontPath = Join-Path $fontDir "$f.ttf"
            $fontsFolder.CopyHere($fontPath, 0x10)
          }

      - run: npm ci

      - name: Verify tools
        shell: pwsh
        run: |
          Write-Host "pandoc: $(pandoc --version | Select-Object -First 1)"
          Write-Host "xelatex: $(xelatex --version 2>&1 | Select-Object -First 1)"
          Write-Host "mmdc: $(mmdc --version 2>&1 | Select-Object -First 1)"

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-windows
          path: result/
          retention-days: 7
